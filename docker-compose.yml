services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./migrations/001_create_links.sql:/docker-entrypoint-initdb.d/001_create_links.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d url_shortener"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      STORAGE: postgres
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/url_shortener?sslmode=disable
      HTTP_ADDR: :8080
      LOG_OUTPUT: stdout
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: